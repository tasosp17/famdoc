version: '3.8'
services:
  db:
    image: postgres:15
    container_name: famdoc-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: famdoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M # Limits the container to half a gig

volumes:
  postgres_data: